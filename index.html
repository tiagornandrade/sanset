    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#30D158", // macOS green (maximize button color)
              "accent": "#4CD964", // Lighter macOS green for secondary elements
              "background-dark": "#0A0A0A", // Pure dark gray (neutral)
              "card-dark": "#151515", // Slightly lighter dark gray
              "border-subtle": "rgba(255, 255, 255, 0.08)", // Very subtle borders
            },
            fontFamily: {
              "sans": ["Plus Jakarta Sans", "sans-serif"],
              "mono": ["JetBrains Mono", "monospace"]
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #0A0A0A;
        color: #f5f5f5;
      }
      .neural-grid {
        background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.03) 1px, transparent 0);
        background-size: 24px 24px;
      }
      .glow-aura {
        background: radial-gradient(circle at 50% 0%, rgba(48, 209, 88, 0.03) 0%, transparent 50%);
      }
      .glass-card {
        background: rgba(21, 21, 21, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s ease;
      }
      .glass-card:hover {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(48, 209, 88, 0.04);
        transform: translateY(-2px);
      }
      .agent-glow {
        filter: drop-shadow(0 0 8px rgba(48, 209, 88, 0.12));
      }
      .text-phosphor {
        text-shadow: 0 0 6px rgba(48, 209, 88, 0.15);
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes surveyInFwd {
        0% { opacity: 0; transform: translateX(24px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes surveyInBack {
        0% { opacity: 0; transform: translateX(-24px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      .animate-survey-in-fwd {
        animation: surveyInFwd 0.3s ease-out;
      }
      .animate-survey-in-back {
        animation: surveyInBack 0.3s ease-out;
      }
      /* Very subtle macOS green gradient overlay */
      body::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(180deg, rgba(48, 209, 88, 0.008) 0%, transparent 40%, transparent 60%, rgba(76, 217, 100, 0.008) 100%);
        z-index: 9999;
        pointer-events: none;
        opacity: 0.6;
      }
    </style>
