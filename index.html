
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanset | Next-Gen Agentic Ecosystems</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#4ade80", // Green Phosphor (Tailwind green-400)
              "tech-green": "#22c55e", // Deeper Phosphor Green
              "background-dark": "#020402", // Deep black with a hint of green
              "card-dark": "#0a0c0a",
            },
            fontFamily: {
              "sans": ["Plus Jakarta Sans", "sans-serif"],
              "mono": ["JetBrains Mono", "monospace"]
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #020402;
        color: #f1f5f9;
      }
      .neural-grid {
        background-image: radial-gradient(circle at 1px 1px, rgba(74, 222, 128, 0.08) 1px, transparent 0);
        background-size: 24px 24px;
      }
      .glow-aura {
        background: radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.1) 0%, rgba(74, 222, 128, 0.05) 40%, transparent 70%);
      }
      .glass-card {
        background: rgba(10, 12, 10, 0.75);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(74, 222, 128, 0.1);
        transition: all 0.3s ease;
      }
      .glass-card:hover {
        border-color: rgba(74, 222, 128, 0.3);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(74, 222, 128, 0.05);
        transform: translateY(-2px);
      }
      .agent-glow {
        filter: drop-shadow(0 0 15px rgba(74, 222, 128, 0.4));
      }
      .text-phosphor {
        text-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      /* Custom scanline effect for that monitor feel */
      body::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
        z-index: 9999;
        background-size: 100% 4px, 3px 100%;
        pointer-events: none;
        opacity: 0.3;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
